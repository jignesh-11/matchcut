<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090b0e" />
      <stop offset="100%" stop-color="#111622" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2638" />
      <stop offset="100%" stop-color="#131722" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Ambient light blobs -->
  <circle cx="300" cy="180" r="220" fill="#3b82f6" opacity="0.18" filter="url(#glow)" />
  <circle cx="950" cy="400" r="260" fill="#6366f1" opacity="0.16" filter="url(#glow)" />

  <!-- Brand Tag -->
  <g transform="translate(80, 85)">
    <rect width="210" height="38" rx="19" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.4" />
    <circle cx="22" cy="19" r="5" fill="#3b82f6" />
    <text x="36" y="24" fill="#93c5fd" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="1">KINETIC VIDEO ENGINE</text>
  </g>

  <!-- Main Title -->
  <text x="80" y="200" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" letter-spacing="-1.5">
    MatchType
  </text>
  <text x="80" y="260" fill="url(#textGrad)" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800">
    Kinetic Text Match Cut Studio
  </text>

  <!-- Subtitle -->
  <text x="80" y="325" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400">
    Create viral, sub-pixel anchored word transitions for TikTok,
  </text>
  <text x="80" y="358" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400">
    Reels, and Shorts right inside your browser. No After Effects needed.
  </text>

  <!-- Feature Pills -->
  <g transform="translate(80, 430)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="160" height="42" rx="10" fill="#171e2e" stroke="#2563eb" stroke-width="1" stroke-opacity="0.3" />
    <text x="20" y="26" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14" font-weight="600">⚡ 100% In-Browser</text>

    <!-- Pill 2 -->
    <rect x="175" y="0" width="165" height="42" rx="10" fill="#171e2e" stroke="#2563eb" stroke-width="1" stroke-opacity="0.3" />
    <text x="195" y="26" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14" font-weight="600">🎯 Word Anchored</text>

    <!-- Pill 3 -->
    <rect x="355" y="0" width="155" height="42" rx="10" fill="#171e2e" stroke="#2563eb" stroke-width="1" stroke-opacity="0.3" />
    <text x="375" y="26" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14" font-weight="600">🎬 4K MP4 Export</text>
  </g>

  <!-- Right Side Visual Card Mockup -->
  <g transform="translate(760, 100)">
    <rect width="360" height="440" rx="24" fill="url(#boxGrad)" stroke="#334155" stroke-width="2" />
    <rect x="15" y="15" width="330" height="410" rx="18" fill="#0b0e14" />

    <!-- Anchor Target Badge -->
    <rect x="35" y="35" width="130" height="28" rx="14" fill="#1e293b" />
    <circle cx="50" cy="49" r="4" fill="#3b82f6" />
    <text x="62" y="54" fill="#60a5fa" font-family="monospace" font-size="11" font-weight="bold">ANCHOR: [MAKE]</text>

    <!-- Visualized text cut -->
    <text x="180" y="160" fill="#64748b" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="middle">BUILD SOMETHING</text>
    <rect x="70" y="185" width="220" height="65" rx="12" fill="#2563eb" fill-opacity="0.2" stroke="#3b82f6" stroke-width="2" />
    <text x="180" y="232" fill="#ffffff" font-family="system-ui, sans-serif" font-size="44" font-weight="900" text-anchor="middle" letter-spacing="2">MAKE</text>
    <text x="180" y="295" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="28" font-weight="800" text-anchor="middle">IT YOURS.</text>

    <line x1="35" y1="350" x2="325" y2="350" stroke="#1e293b" stroke-width="1.5" />
    <text x="180" y="385" fill="#475569" font-family="monospace" font-size="12" text-anchor="middle">SUB-PIXEL ANCHOR LOCKED</text>
  </g>
</svg>
